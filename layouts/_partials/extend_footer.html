<script>
    if (document.querySelector("pre code.language-mermaid")) {
        import("https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs").then(
            ({ default: mermaid }) => {
                document
                    .querySelectorAll("pre code.language-mermaid")
                    .forEach((block) => {
                        const graph = document.createElement("pre");
                        graph.className = "mermaid";
                        graph.textContent = block.textContent;
                        block.parentElement.replaceWith(graph);
                    });
                mermaid.initialize({
                    startOnLoad: false,
                    theme:
                        document.documentElement.dataset.theme === "dark"
                            ? "dark"
                            : "default",
                    themeVariables: { fontSize: "20px" },
                });
                mermaid.run({ querySelector: ".mermaid" });
            },
        );
    }
</script>
