baseURL: https://occamist.dev/
locale: en-us
title: Occamist.dev
theme: PaperMod
pagination:
  pagerSize: 5

minify:
  disableXML: true
  minifyOutput: true

markup:
  goldmark:
    renderer:
      # All content is authored solely by us, not by untrusted/external
      # contributors, so the raw-HTML XSS risk this flag guards against
      # doesn't apply here. Without it, tags like <br/> and <cite> in our
      # posts get silently stripped from the rendered output.
      unsafe: true

menu:
  main:
    - name: Search
      url: search/
      weight: 10
    - name: Archive
      url: archives/
      weight: 10
    - name: Tags
      url: tags/
      weight: 10

outputs:
  home:
    - HTML
    - RSS
    - JSON # is necessary

params:
  author: Talha Altinel
  ShowReadingTime: true
  ShowShareButtons: false
  ShowPostNavLinks: true
  ShowBreadCrumbs: true
  ShowCodeCopyButtons: true
  ShowWordCount: true
  hideFooter: true

  homeInfoParams:
    Title: Hello there! 🐧🐧🐧
    Content: "Welcome to Occamist's blog about software engineering 🌌"

  socialIcons:
    - name: github
      url: "https://github.com/occamist"
    - name: linkedin
      url: "https://linkedin.com/in/talha-altinel"
    - name: cv
      url: "https://app.flowcv.com/api/public/download_resume?token=wqbisuaju8"
    - name: email
      url: "mailto:talhaaltinel@hotmail.com"

  # for search, https://fusejs.io/api/options.html
  fuseOpts:
    isCaseSensitive: false
    shouldSort: true
    location: 0
    distance: 1000
    threshold: 0.4
    minMatchCharLength: 2
    keys: ["title", "permalink", "summary", "content"]
